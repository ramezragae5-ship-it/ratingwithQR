<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رأيك يهمنا | صحتك فلاحي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0f7a43;--g2:#0b5f34;--y:#f9c80e;--line:#cfe6d8}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;color:#1f2937;min-height:100vh;
background:radial-gradient(circle at 0 0,#d9efe1 0,transparent 30%),radial-gradient(circle at 100% 100%,#d9efe1 0,transparent 30%),#f4faf6}
.wrap{max-width:480px;margin:0 auto;padding:24px 16px 32px;text-align:center}
.logo{width:130px;height:auto}
h1{color:var(--g);font-size:34px;font-weight:800;margin:10px 0 2px}
.sub{font-size:18px;margin:0 0 20px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 14px 12px;margin:12px 0;text-align:right}
.q{font-size:19px;font-weight:700;margin-bottom:10px}
.stars{display:flex;justify-content:center;gap:10px;direction:ltr}
.s{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-family:inherit;-webkit-tap-highlight-color:transparent}
.s svg{width:46px;height:46px;fill:none;stroke:#f5b800;stroke-width:1.8;stroke-linejoin:round;transition:transform .12s}
.s.on svg{fill:#fbbf24}
.s:active svg{transform:scale(1.2)}
.s span{font-size:13px;color:#6b8f7a;font-weight:700;margin-top:2px}
.btn{width:100%;margin-top:14px;border:0;border-radius:999px;background:var(--g);color:#fff;font:700 20px 'Cairo',sans-serif;padding:13px;cursor:pointer}
.btn:disabled{opacity:.45}
.btn:not(:disabled):hover{background:var(--g2)}
.who{display:flex;align-items:center;gap:12px;background:#e8f4ec;border-radius:16px;padding:12px 14px;margin:0 0 6px;text-align:right}
.who i{width:52px;height:52px;border-radius:50%;background:#dcefe3;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px}
.who b{display:block;color:var(--g);font-size:18px}.who span{font-size:19px;font-weight:700;direction:ltr;display:inline-block}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:14px}.qr{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;break-inside:avoid}.qr div.c{display:flex;justify-content:center;margin-bottom:8px}.qr b{direction:ltr;display:block}
@media print{.noprint{display:none}}
.foot{margin-top:18px;color:var(--g);font-weight:700;font-size:15px}
.err{color:#c0392b;margin-top:10px;font-size:14px}
.ok{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:36px 16px;margin-top:20px;font-size:22px;font-weight:700;color:var(--g)}
</style>
</head>

<h1>رأيك يهمنا</h1>
<p class="sub">قيّم تجربتك مع صحتك فلاحي</p>
<div id="form">
<div class="who" id="who"><i>👤</i><div><b>تقييم الموظف</b><span id="wname"></span></div></div>
<div class="card"><div class="q">كيف تقيّم تعامل الموظّف؟</div><div class="stars" data-k="q1"></div></div>
<div class="card"><div class="q">هل كان الموظف متعاوناً وسريع الاستجابة؟</div><div class="stars" data-k="q2"></div></div>
<div class="card"><div class="q">ما مدى رضاك عن تجربتك بشكل عام؟</div><div class="stars" data-k="q3"></div></div>
<button class="btn" id="send" disabled>إرسال التقييم</button>
<div class="err" id="err"></div>
</div>
<div class="foot">شكرًا لثقتك في صحتك فلاحي 💚</div>
</div>
<script>
// ضع هنا رابط Google Apps Script بعد النشر
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz79_1ff_mbD_YLZSeAz-nwjXgyvnnp9XDE9_1oXNSLrsn8Li7CbOwSDD8bqNTOR-JJ_g/exec";
const EMP={moaz:"Moaz Adel",ramez:"Ramez Morgan",ehab:"Mohamed Ehab",amr:"Amr Noamany"};
const key=new URLSearchParams(location.search).get("e");
const admin=new URLSearchParams(location.search).has("admin");
const emp=EMP[key];
const ans={q1:0,q2:0,q3:0};
const star='<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.4.9-4.6 4.5 1.1 6.3L12 17.2 6.3 20.3l1.1-6.3L2.8 9.5l6.4-.9z"/></svg>';
document.querySelectorAll(".stars").forEach(box=>{
  for(let i=5;i>=1;i--){
    const b=document.createElement("button");b.type="button";b.className="s";b.setAttribute("aria-label",i+" من 5");
    b.innerHTML=star+"<span>"+i+"</span>";
    b.onclick=()=>{ans[box.dataset.k]=i;paint()};
    box.appendChild(b);
  }
});
// النجوم مرتبة 5..1 من اليسار؛ اليمين = 1 كما في التصميم
document.querySelectorAll(".stars").forEach(b=>b.style.direction="rtl");
function paint(){
  document.querySelectorAll(".stars").forEach(box=>{
    const v=ans[box.dataset.k];
    box.querySelectorAll(".s").forEach((s,idx)=>{const n=5-idx;s.classList.toggle("on",n<=v)});
  });
  document.getElementById("send").disabled=!(ans.q1&&ans.q2&&ans.q3);
}
if(admin){
  const base=location.origin+location.pathname;
  let h='<h1>رموز QR للموظفين</h1><p class="sub noprint">اطبع الصفحة (Ctrl+P) أو خد لقطة لكل رمز</p><div class="qrs">';
  Object.keys(EMP).forEach(k=>h+='<div class="qr"><div class="c" id="qr_'+k+'"></div><b>'+EMP[k]+'</b></div>');
  document.getElementById("app").innerHTML=h+'</div>';
  const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
  s.onload=()=>Object.keys(EMP).forEach(k=>new QRCode(document.getElementById("qr_"+k),{text:base+"?e="+k,width:160,height:160,correctLevel:QRCode.CorrectLevel.H}));
  document.body.appendChild(s);
}else if(!emp){
  document.getElementById("form").innerHTML='<div class="ok">من فضلك امسح رمز QR الخاص بالموظف</div>';
}else{document.getElementById("wname").textContent=emp}
const sb=document.getElementById("send");if(sb)sb.onclick=async()=>{
  const btn=document.getElementById("send"),err=document.getElementById("err");
  btn.disabled=true;err.textContent="";
  try{
    if(SCRIPT_URL.startsWith("PASTE"))throw 0;
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({emp:emp,q1:ans.q1,q2:ans.q2,q3:ans.q3})});
    document.getElementById("form").innerHTML='<div class="ok">✅ شكرًا لك، تم إرسال تقييمك</div>';
  }catch(e){err.textContent="تعذّر الإرسال، حاول مرة أخرى.";btn.disabled=false}
};
</script>
</body>
</html>
